LogLevel '4'
ListenUDP '0.0.0.0:1812'
ListenUDP '0.0.0.0:1813'
LoopPrevention 'on'

tls 'longfi' {
    CACertificateFile '/certs/ca.pem'
    certificateFile '/certs/cert.pem'
    certificateKeyFile '/certs/key.pem'
    TLSVersion TLS1_2:
    CipherList "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!DSS:!RSA"
}

client 'local' {
    host '0.0.0.0/0'
    type 'udp'
    secret 'changeme'
}

server 'longfi' {
    host 'connect.longfisolutions.com'
    port '2083'
    type 'tls'
    tls 'longfi'
    certificateNameCheck off
    statusServer on
}

realm '/.*\.longfisolutions\.com$/' {
    server 'longfi'
    accountingServer 'longfi'
}
realm '/.*\.premnet\.wefi\.com$/' {
    server 'longfi'
    accountingServer 'longfi'
}
